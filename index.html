<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Studio-Schnittmenge</title>
<meta name="description" content="Studios, die bei Urban Sports Club und bei Wellpass dabei sind – Raum Köln/Bonn.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: Seitenleiste (Filter + Liste) links, Karte rechts; auf dem Handy umschaltbar Karte/Liste. */
:root {
  --bg: #f6f7f5;
  --panel: #ffffff;
  --fg: #16201b;
  --muted: #5f6b65;
  --line: #dde3df;
  --chip: #eef2ef;
  --both: #0f8a5f;      /* gemeinsam */
  --both-ink: #ffffff;
  --usc: #3b5bdb;       /* nur Urban */
  --wp: #d9480f;        /* nur Wellpass */
  --maybe: #b7791f;
  --focus: #0f8a5f;
  --shadow: 0 1px 2px rgba(20,30,25,.06), 0 8px 24px rgba(20,30,25,.08);
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1412; --panel: #161d1a; --fg: #e8eeea; --muted: #97a59e; --line: #2a3530; --chip: #1f2925;
    --both: #2fbf86; --both-ink: #06140e; --usc: #7b93ff; --wp: #ff8a50; --maybe: #e0a84a; --focus: #2fbf86;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1412; --panel: #161d1a; --fg: #e8eeea; --muted: #97a59e; --line: #2a3530; --chip: #1f2925;
  --both: #2fbf86; --both-ink: #06140e; --usc: #7b93ff; --wp: #ff8a50; --maybe: #e0a84a; --focus: #2fbf86;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font: 14px/1.45 var(--f-body);
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(340px, 420px) 1fr;
  grid-template-rows: 100%;
}
.side {
  display: flex; flex-direction: column; min-height: 0; min-width: 0;
  background: var(--panel); border-right: 1px solid var(--line);
}
.head {
  padding: max(14px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));
  border-bottom: 1px solid var(--line);
  display: grid; gap: 12px;
}
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 {
  margin: 0; font-family: var(--f-display); font-weight: 800; font-stretch: 80%;
  font-size: 26px; letter-spacing: -.01em; line-height: 1;
  text-wrap: balance;
}
h1 .venn { display: inline-block; width: 30px; height: 18px; vertical-align: -2px; margin-right: 6px; }
.stand { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }

.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.field { display: grid; gap: 4px; }
.label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
select, .btn {
  height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
  padding: 0 10px;
}
select { padding-right: 28px; min-width: 0; }
.btn { cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn svg { width: 16px; height: 16px; }
.where { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.radius { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.radius output { font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; font-weight: 600; }
input[type=range] { width: 100%; accent-color: var(--both); }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button {
  border: 0; background: transparent; height: 32px; min-width: 40px; padding: 0 10px; cursor: pointer;
  font-weight: 600; font-variant-numeric: tabular-nums;
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--panel); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--chip); border-radius: 999px;
  padding: 4px 10px; font-size: 12.5px; cursor: pointer; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--fg); color: var(--panel); border-color: var(--fg); }

.toggles { display: grid; gap: 6px; }
.tg { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; }
.tg input { width: 16px; height: 16px; accent-color: var(--both); margin: 0; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.dot.both { background: var(--both); }
.dot.maybe { background: transparent; border: 2px dashed var(--maybe); width: 11px; height: 11px; }
.dot.usc { background: var(--usc); }
.dot.wp { background: var(--wp); }

details.more > summary {
  cursor: pointer; list-style: none; color: var(--muted); font-size: 12.5px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px;
}
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: "▸"; transition: transform .15s; }
details.more[open] > summary::before { transform: rotate(90deg); }
details.more > .inner { display: grid; gap: 12px; padding-top: 10px; }

.summary {
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  border-bottom: 1px solid var(--line);
  display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap;
}
.big { font-family: var(--f-display); font-weight: 800; font-size: 30px; line-height: 1; color: var(--both); font-variant-numeric: tabular-nums; }
.summary .txt { color: var(--muted); font-size: 13px; }
.summary .txt b { color: var(--fg); font-weight: 600; }

.list { flex: 1; overflow-y: auto; min-height: 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
.item {
  display: grid; grid-template-columns: 12px 1fr auto; gap: 4px 10px; align-items: start;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  border-bottom: 1px solid var(--line); cursor: pointer; background: transparent; border-left: 0; border-right: 0; border-top: 0;
  width: 100%; text-align: left;
}
.item:hover, .item.active { background: var(--chip); }
.item .dot { margin-top: 5px; }
.item .nm { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.item .km { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; padding-top: 2px; }
.item .meta { grid-column: 2 / 4; color: var(--muted); font-size: 12.5px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.item.dim .nm, .item.dim .meta { opacity: .5; }
.tag {
  font-size: 11px; font-weight: 600; letter-spacing: .02em; padding: 1px 6px; border-radius: 4px;
  border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
}
.tag.maybe { border-color: var(--maybe); color: var(--maybe); }
.tag.warn { border-color: var(--wp); color: var(--wp); }
.plans { display: inline-flex; gap: 2px; }
.plans span { font-size: 10.5px; font-weight: 700; width: 18px; text-align: center; border-radius: 3px; padding: 1px 0; background: var(--chip); color: var(--muted); opacity: .55; }
.plans span.on { background: var(--usc); color: #fff; opacity: 1; }
.empty { padding: 28px 16px; color: var(--muted); text-align: center; display: grid; gap: 8px; }
.morebtn { margin: 12px auto 20px; display: flex; }

.mapwrap { position: relative; min-width: 0; min-height: 0; }
#map { position: absolute; inset: 0; background: var(--bg); }
.leaflet-container { font: inherit; }
/* Karte etwas zurücknehmen, damit die Punkte hervorstechen; im Dunkelmodus invertiert */
#map .leaflet-tile-pane { filter: saturate(.55) contrast(.95) brightness(1.03); }
#map.dark .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) saturate(.4) brightness(.85) contrast(.9); }
.leaflet-control-attribution { font-size: 10px; }

.legend {
  position: absolute; z-index: 500; left: 12px; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
  padding: 8px 10px; display: grid; gap: 4px; font-size: 12px;
}
.legend div { display: flex; align-items: center; gap: 8px; }

/* Detail */
.detail {
  position: absolute; z-index: 600; top: 12px; right: 12px; width: min(380px, calc(100% - 24px));
  max-height: calc(100% - 24px); overflow-y: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
}
.detail .top { padding: 14px 16px 10px; display: grid; gap: 6px; border-bottom: 1px solid var(--line); position: relative; }
.detail h2 { margin: 0; padding-right: 32px; font-family: var(--f-display); font-weight: 750; font-stretch: 85%; font-size: 21px; line-height: 1.15; text-wrap: balance; overflow-wrap: anywhere; }
.detail .close { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: 18px; line-height: 1; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; }
.status.both { color: var(--both); }
.status.usc { color: var(--usc); }
.status.wp { color: var(--wp); }
.status.maybe { color: var(--maybe); }
.prov { padding: 12px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
.prov h3 { margin: 0; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.prov h3.usc { color: var(--usc); }
.prov h3.wp { color: var(--wp); }
.prov .pn { font-weight: 600; overflow-wrap: anywhere; }
.prov .pa { color: var(--muted); font-size: 13px; }
.prov a { color: inherit; font-size: 13px; font-weight: 600; text-underline-offset: 3px; }
.prov.off { color: var(--muted); font-size: 13px; }
.detail .acts { padding: 12px 16px 16px; display: flex; gap: 8px; flex-wrap: wrap; }
.btn.primary { background: var(--both); color: var(--both-ink); border-color: var(--both); font-weight: 600; text-decoration: none; }
.small { font-size: 12.5px; color: var(--muted); }

.mobilebar { display: none; }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .side { border-right: 0; min-height: 0; }
  .app[data-view="map"] .list, .app[data-view="map"] .summary { display: none; }
  .app[data-view="list"] .mapwrap { display: none; }
  .app[data-view="list"] { grid-template-rows: 1fr 0; }
  .mobilebar {
    display: flex; gap: 8px; align-items: center; justify-content: space-between;
  }
  .detail { top: auto; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); right: 10px; left: 10px; width: auto; max-height: 62%; }
  .legend { display: none; }
  h1 { font-size: 22px; }
  .filters { display: none; }
  .app.filters-open .filters { display: grid; gap: 12px; }
  .mobilebar .small { flex: 1; text-align: center; }
}
@media (min-width: 761px) { .filters { display: grid; gap: 12px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app" id="app" data-view="map">
  <aside class="side">
    <div class="head">
      <div class="brand">
        <h1><svg class="venn" viewBox="0 0 30 18" aria-hidden="true"><circle cx="10" cy="9" r="8" fill="var(--usc)" opacity=".85"/><circle cx="20" cy="9" r="8" fill="var(--wp)" opacity=".85"/><path d="M15 2.76a8 8 0 0 1 0 12.48a8 8 0 0 1 0-12.48z" fill="var(--both)"/></svg>Studio-Schnittmenge</h1>
        <span class="stand" id="stand"></span>
      </div>

      <div class="where">
        <div class="field">
          <label class="label" for="town">Ort</label>
          <select id="town"></select>
        </div>
        <div class="field">
          <span class="label">&nbsp;</span>
          <button class="btn" id="locate" type="button" title="Karte auf deinen Standort zentrieren">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
            Mein Standort
          </button>
        </div>
      </div>

      <div class="filters" id="filters">
      <div class="radius">
        <label class="label" for="radius">Umkreis</label>
        <input type="range" id="radius" min="1" max="25" step="1" value="5">
        <output id="radiusOut" for="radius">5 km</output>
      </div>

      <div class="field">
        <span class="label" id="planLbl">Dein Urban-Tarif</span>
        <div class="seg" role="group" aria-labelledby="planLbl" id="plan">
          <button type="button" data-plan="1" aria-pressed="false" title="Essential">S</button>
          <button type="button" data-plan="2" aria-pressed="true" title="Classic">M</button>
          <button type="button" data-plan="3" aria-pressed="false" title="Premium">L</button>
          <button type="button" data-plan="6" aria-pressed="false" title="Max">XL</button>
        </div>
      </div>

      <details class="more" id="moreBox">
        <summary id="moreSum">Kategorien &amp; Anzeige</summary>
        <div class="inner">
          <div class="field">
            <span class="label">Kategorien</span>
            <div class="chips" id="cats"></div>
          </div>
          <div class="toggles">
            <label class="tg"><input type="checkbox" id="tMaybe" checked><span class="dot maybe"></span>Unsichere Treffer („vielleicht dasselbe Studio“)</label>
            <label class="tg"><input type="checkbox" id="tUsc"><span class="dot usc"></span>Auch Studios nur bei Urban</label>
            <label class="tg"><input type="checkbox" id="tWp"><span class="dot wp"></span>Auch Studios nur bei Wellpass</label>
            <label class="tg"><input type="checkbox" id="tHide"><span class="dot" style="background:var(--line)"></span>Studios außerhalb meines Tarifs ausblenden</label>
          </div>
        </div>
      </details>
      </div>

      <div class="mobilebar">
        <div class="seg" role="group" aria-label="Ansicht">
          <button type="button" data-view="map" aria-pressed="true">Karte</button>
          <button type="button" data-view="list" aria-pressed="false">Liste</button>
        </div>
        <span class="small" id="mobCount"></span>
        <button class="btn" type="button" id="filterBtn" aria-expanded="false" aria-controls="filters">Filter</button>
      </div>
    </div>

    <div class="summary" id="summary"></div>
    <div class="list" id="list" role="list"></div>
  </aside>

  <main class="mapwrap">
    <div id="map" aria-label="Karte der Studios"></div>
    <div class="legend" aria-hidden="true">
      <div><span class="dot both"></span>Bei beiden</div>
      <div><span class="dot maybe"></span>Vielleicht bei beiden</div>
      <div><span class="dot usc"></span>Nur Urban</div>
      <div><span class="dot wp"></span>Nur Wellpass</div>
    </div>
    <section class="detail" id="detail" hidden aria-live="polite"></section>
  </main>
</div>

const PLAN_NAMES = { 1: "S", 2: "M", 3: "L", 6: "XL" };

const store = {
  get(k, d) { try { const v = localStorage.getItem("ssm:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ssm:" + k, JSON.stringify(v)); } catch {} },
};

const state = {
  center: store.get("center", { name: "Bonn", lat: 50.7374, lng: 7.0982 }),
  radius: store.get("radius", 5),
  plan: store.get("plan", 2),
  cats: new Set(store.get("cats", [])),
  showMaybe: store.get("showMaybe", true),
  showUsc: store.get("showUsc", false),
  showWp: store.get("showWp", false),
  hideOutside: store.get("hideOutside", false),
  selected: null,
  listLimit: 150,
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function km(a, b) {
  const R = 6371, dLat = (b.lat - a.lat) * Math.PI / 180, dLng = (b.lng - a.lng) * Math.PI / 180;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
const fmtKm = (d) => d < 1 ? Math.round(d * 1000 / 10) * 10 + " m" : d.toFixed(1).replace(".", ",") + " km";

// Studio-Eigenschaften
const studios = DATA.studios.map((s, i) => ({ ...s, i }));
function kindOf(s) { return s.k === "both" ? (s.m === "vielleicht" ? "maybe" : "both") : s.k; }
// Urban listet je Studio die Tarife, in denen es enthalten ist (z. B. M, L, XL).
function coveredByPlan(s) { return !s.u || s.u.plans.includes(state.plan); }

function visible(s) {
  const k = kindOf(s);
  if (k === "maybe" && !state.showMaybe) return false;
  if (k === "usc" && !state.showUsc) return false;
  if (k === "wp" && !state.showWp) return false;
  if (state.cats.size && !s.cats.some((c) => state.cats.has(c))) return false;
  if (state.hideOutside && !coveredByPlan(s)) return false;
  return true;
}

// ---------------------------------------------------------------- Karte
const map = L.map("map", { preferCanvas: true, zoomControl: true, attributionControl: true }).setView([state.center.lat, state.center.lng], 13);
let tiles;
function setTiles() {
  const dark = document.documentElement.dataset.theme === "dark" ||
    (document.documentElement.dataset.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
  if (!tiles) {
    tiles = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-Mitwirkende',
    }).addTo(map);
  }
  document.getElementById("map").classList.toggle("dark", dark);
}
setTiles();
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { setTiles(); restyle(); });

const renderer = L.canvas({ padding: 0.5, tolerance: 6 });
const markers = new Map();
let circle = null, centerMark = null;

function markerStyle(s) {
  const k = kindOf(s), dim = !coveredByPlan(s), sel = state.selected === s.i;
  const col = { both: cssVar("--both"), maybe: cssVar("--maybe"), usc: cssVar("--usc"), wp: cssVar("--wp") }[k];
  const big = k === "both" || k === "maybe";
  return {
    renderer, radius: (big ? 7 : 4.5) + (sel ? 3 : 0),
    color: sel ? cssVar("--fg") : (k === "maybe" ? col : cssVar("--panel")),
    weight: sel ? 3 : (k === "maybe" ? 2 : 1.5),
    dashArray: k === "maybe" && !sel ? "3 3" : null,
    fillColor: col,
    fillOpacity: dim ? 0.22 : (k === "maybe" ? 0.35 : 0.92),
    opacity: dim ? 0.4 : 1,
  };
}
function restyle() { markers.forEach((m, i) => m.setStyle(markerStyle(studios[i]))); drawCircle(); }

function drawMarkers() {
  markers.forEach((m) => m.remove());
  markers.clear();
  // nur-Urban/nur-Wellpass zuerst, damit gemeinsame Studios oben liegen
  const order = studios.filter(visible).sort((a, b) => (a.k === "both") - (b.k === "both"));
  for (const s of order) {
    const m = L.circleMarker([s.lat, s.lng], markerStyle(s)).addTo(map);
    m.on("click", () => select(s.i, false));
    m.bindTooltip(esc(s.name), { direction: "top", offset: [0, -6] });
    markers.set(s.i, m);
  }
}

function drawCircle() {
  const c = [state.center.lat, state.center.lng];
  const style = { color: cssVar("--fg"), weight: 1, opacity: .35, dashArray: "4 4", fill: true, fillColor: cssVar("--fg"), fillOpacity: .03, interactive: false };
  if (!circle) circle = L.circle(c, { ...style, radius: state.radius * 1000 }).addTo(map);
  else { circle.setLatLng(c); circle.setRadius(state.radius * 1000); circle.setStyle(style); }
  const cs = { radius: 5, color: cssVar("--panel"), weight: 2, fillColor: cssVar("--fg"), fillOpacity: 1, interactive: false };
  if (!centerMark) centerMark = L.circleMarker(c, cs).addTo(map); else { centerMark.setLatLng(c); centerMark.setStyle(cs); }
}

function fitRadius() {
  if (!circle) return;
  map.invalidateSize();
  // L.circle kennt seine Ausdehnung erst nach dem Zeichnen; deshalb selbst berechnen
  const c = state.center, dLat = state.radius / 111.32, dLng = state.radius / (111.32 * Math.cos(c.lat * Math.PI / 180));
  map.fitBounds([[c.lat - dLat, c.lng - dLng], [c.lat + dLat, c.lng + dLng]], { padding: [16, 16] });
}

// ---------------------------------------------------------------- Liste
function inRadius() {
  return studios
    .filter(visible)
    .map((s) => ({ s, d: km(state.center, s) }))
    .filter((x) => x.d <= state.radius)
    .sort((a, b) => {
      const ka = a.s.k === "both" ? 0 : 1, kb = b.s.k === "both" ? 0 : 1;
      return ka - kb || a.d - b.d;
    });
}

function plansHtml(u) {
  if (!u) return "";
  return `<span class="plans" title="Urban-Tarife">${[1, 2, 3, 6].map((p) => `<span class="${u.plans.includes(p) ? "on" : ""}">${PLAN_NAMES[p]}</span>`).join("")}</span>`;
}

function renderList() {
  const rows = inRadius();
  const both = rows.filter((x) => kindOf(x.s) === "both").length;
  const maybe = rows.filter((x) => kindOf(x.s) === "maybe").length;
  const bothCovered = rows.filter((x) => kindOf(x.s) === "both" && coveredByPlan(x.s)).length;
  $("summary").innerHTML = `
    <span class="big">${both}</span>
    <span class="txt"><b>gemeinsame Studios</b> im Umkreis von ${state.radius} km um ${esc(state.center.name)}${maybe ? `, dazu ${maybe} unsichere` : ""}.
    ${both ? `Davon ${bothCovered} in deinem Tarif ${PLAN_NAMES[state.plan]}.` : ""}</span>`;
  $("mobCount").textContent = `${both} gemeinsam · ${state.radius} km`;

  if (!rows.length) {
    $("list").innerHTML = `<div class="empty"><b>Keine Studios in diesem Umkreis.</b><span>Vergrößere den Umkreis oder entferne Kategorie-Filter.</span></div>`;
    return;
  }
  const shown = rows.slice(0, state.listLimit);
  $("list").innerHTML = shown.map(({ s, d }) => {
    const k = kindOf(s), dim = !coveredByPlan(s);
    const sub = [];
    if (k === "maybe") sub.push(`<span class="tag maybe">vielleicht</span>`);
    if (k === "usc") sub.push(`<span class="tag">nur Urban</span>`);
    if (k === "wp") sub.push(`<span class="tag">nur Wellpass</span>`);
    if (s.w?.ladies) sub.push(`<span class="tag warn">nur Frauen</span>`);
    if (dim && s.u) sub.push(`<span class="tag">nicht in ${PLAN_NAMES[state.plan]}</span>`);
    sub.push(plansHtml(s.u));
    const cats = s.cats.map((c) => DATA.cats[c]).filter(Boolean).slice(0, 3).join(" · ");
    if (cats) sub.push(`<span>${esc(cats)}</span>`);
    return `<button class="item ${dim ? "dim" : ""} ${state.selected === s.i ? "active" : ""}" data-i="${s.i}" role="listitem">
      <span class="dot ${k}"></span><span class="nm">${esc(s.name)}</span><span class="km">${fmtKm(d)}</span>
      <span class="meta">${sub.join("")}</span></button>`;
  }).join("") + (rows.length > shown.length ? `<button class="btn morebtn" id="moreRows" type="button">${rows.length - shown.length} weitere anzeigen</button>` : "");
}

$("list").addEventListener("click", (e) => {
  if (e.target.closest("#moreRows")) { state.listLimit += 300; renderList(); return; }
  const b = e.target.closest(".item"); if (!b) return;
  select(+b.dataset.i, true);
});

// ---------------------------------------------------------------- Detail
function select(i, fromList) {
  const prev = state.selected;
  state.selected = i;
  if (prev != null && markers.get(prev)) markers.get(prev).setStyle(markerStyle(studios[prev]));
  const s = studios[i];
  const m = markers.get(i);
  if (m) { m.setStyle(markerStyle(s)); m.bringToFront(); }
  document.querySelectorAll(".item.active").forEach((el) => el.classList.remove("active"));
  document.querySelector(`.item[data-i="${i}"]`)?.classList.add("active");
  renderDetail(s);
  const mobile = matchMedia("(max-width: 760px)").matches;
  if (fromList && mobile) setView("map");
  // Punkt so platzieren, dass ihn das Detailfenster nicht verdeckt
  const zoom = fromList ? Math.max(map.getZoom(), 15) : map.getZoom();
  const size = map.getSize(), det = $("detail").getBoundingClientRect();
  const target = mobile
    ? L.point(size.x / 2, Math.max(60, (size.y - det.height - 20) / 2))
    : L.point(Math.max(60, (size.x - det.width - 24) / 2), size.y / 2);
  const p = map.project([s.lat, s.lng], zoom);
  const pt = map.latLngToContainerPoint([s.lat, s.lng]);
  const hidden = mobile ? pt.y > size.y - det.height - 30 : pt.x > size.x - det.width - 36;
  if (fromList || hidden) {
    const center = map.unproject(p.add(L.point(size.x / 2, size.y / 2)).subtract(target), zoom);
    map.setView(center, zoom, { animate: !fromList });
  }
}

function renderDetail(s) {
  const k = kindOf(s), d = km(state.center, s);
  const statusTxt = { both: "Bei beiden dabei", maybe: "Vielleicht bei beiden – bitte prüfen", usc: "Nur bei Urban Sports Club", wp: "Nur bei Wellpass" }[k];
  const cats = s.cats.map((c) => DATA.cats[c]).filter(Boolean);
  const u = s.u, w = s.w;
  const uBlock = u ? `
    <div class="prov">
      <h3 class="usc"><span class="dot usc"></span>Urban Sports Club</h3>
      <div class="pn">${esc(u.name)}</div>
      ${u.addr ? `<div class="pa">${esc(u.addr)}</div>` : ""}
      <div class="row">${plansHtml(u)} <span class="small">${coveredByPlan(s) ? `in deinem Tarif ${PLAN_NAMES[state.plan]}` : `nicht in deinem Tarif ${PLAN_NAMES[state.plan]}`}</span></div>
      ${u.disc.length ? `<div class="small">${esc(u.disc.join(" · "))}</div>` : ""}
      <a href="https://urbansportsclub.com${esc(u.path)}" target="_blank" rel="noopener">Bei Urban Sports Club ansehen ↗</a>
    </div>` : `<div class="prov off"><h3 class="usc"><span class="dot usc"></span>Urban Sports Club</h3>Nicht im Urban-Netz gefunden.</div>`;
  const wBlock = w ? `
    <div class="prov">
      <h3 class="wp"><span class="dot wp"></span>Wellpass</h3>
      <div class="pn">${esc(w.name)}</div>
      <div class="pa">${esc(w.type || "")}${w.ladies ? " · nur für Frauen" : ""}</div>
      ${w.acts.length ? `<div class="small">${esc(w.acts.slice(0, 10).join(" · "))}</div>` : ""}
      <a href="https://locations.egym.com/embed/web/wellpass/${encodeURIComponent(w.slug)}" target="_blank" rel="noopener">Bei Wellpass ansehen ↗</a>
    </div>` : `<div class="prov off"><h3 class="wp"><span class="dot wp"></span>Wellpass</h3>Nicht im Wellpass-Netz gefunden.</div>`;
  $("detail").innerHTML = `
    <div class="top">
      <button class="close" type="button" id="closeDetail" aria-label="Schließen">×</button>
      <span class="status ${k}"><span class="dot ${k}"></span>${statusTxt}</span>
      <h2>${esc(s.name)}</h2>
      <div class="small">${fmtKm(d)} von ${esc(state.center.name)}${s.d != null ? ` · Einträge ${s.d} m auseinander` : ""}</div>
      ${cats.length ? `<div class="chips">${cats.map((c) => `<span class="tag">${esc(c)}</span>`).join("")}</div>` : ""}
    </div>
    ${uBlock}${wBlock}
    <div class="acts">
      <a class="btn primary" href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}" target="_blank" rel="noopener">Route in Google Maps</a>
    </div>`;
  $("detail").hidden = false;
  $("closeDetail").onclick = closeDetail;
}
function closeDetail() {
  const prev = state.selected; state.selected = null;
  if (prev != null && markers.get(prev)) markers.get(prev).setStyle(markerStyle(studios[prev]));
  document.querySelectorAll(".item.active").forEach((el) => el.classList.remove("active"));
  $("detail").hidden = true;
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDetail(); });

// ---------------------------------------------------------------- Steuerung
function setView(v) {
  $("app").dataset.view = v;
  document.querySelectorAll(".mobilebar [data-view]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === v)));
  if (v === "map") setTimeout(() => map.invalidateSize(), 0);
}
document.querySelectorAll(".mobilebar [data-view]").forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));
$("filterBtn").addEventListener("click", () => {
  const open = $("app").classList.toggle("filters-open");
  $("filterBtn").setAttribute("aria-expanded", String(open));
  setTimeout(() => map.invalidateSize(), 0);
});

function setCenter(c, fit = true) {
  state.center = c; store.set("center", c);
  drawCircle(); renderList();
  if (fit) fitRadius();
  if (state.selected != null) renderDetail(studios[state.selected]);
}

const townSel = $("town");
townSel.innerHTML = TOWNS.map(([n], i) => `<option value="${i}">${esc(n)}</option>`).join("") + `<option value="me" hidden>Mein Standort</option><option value="pin" hidden>Punkt auf der Karte</option>`;
function syncTownSelect() {
  const idx = TOWNS.findIndex(([n]) => n === state.center.name);
  townSel.value = idx >= 0 ? String(idx) : (state.center.name === "Mein Standort" ? "me" : "pin");
}
townSel.addEventListener("change", () => {
  const t = TOWNS[+townSel.value]; if (!t) return;
  setCenter({ name: t[0], lat: t[1], lng: t[2] });
});

$("locate").addEventListener("click", () => {
  const btn = $("locate");
  if (!navigator.geolocation) { btn.textContent = "Standort nicht verfügbar"; return; }
  btn.disabled = true;
  navigator.geolocation.getCurrentPosition(
    (p) => { btn.disabled = false; setCenter({ name: "Mein Standort", lat: p.coords.latitude, lng: p.coords.longitude }); syncTownSelect(); },
    () => { btn.disabled = false; btn.title = "Standort wurde nicht freigegeben – wähle einen Ort aus der Liste."; btn.lastChild.textContent = " Standort gesperrt"; },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
  );
});

map.on("contextmenu", (e) => { setCenter({ name: "Punkt auf der Karte", lat: e.latlng.lat, lng: e.latlng.lng }, false); syncTownSelect(); });

const rIn = $("radius");
rIn.value = state.radius; $("radiusOut").textContent = state.radius + " km";
rIn.addEventListener("input", () => {
  state.radius = +rIn.value; $("radiusOut").textContent = state.radius + " km";
  state.listLimit = 150; drawCircle(); renderList();
});
rIn.addEventListener("change", () => { store.set("radius", state.radius); fitRadius(); });

document.querySelectorAll("#plan button").forEach((b) => {
  b.setAttribute("aria-pressed", String(+b.dataset.plan === state.plan));
  b.addEventListener("click", () => {
    state.plan = +b.dataset.plan; store.set("plan", state.plan);
    document.querySelectorAll("#plan button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    refresh();
  });
});

$("cats").innerHTML = Object.entries(DATA.cats).map(([k, v]) =>
  `<button type="button" class="chip" data-cat="${k}" aria-pressed="${state.cats.has(k)}">${esc(v)}</button>`).join("");
$("cats").addEventListener("click", (e) => {
  const c = e.target.closest(".chip"); if (!c) return;
  const k = c.dataset.cat;
  state.cats.has(k) ? state.cats.delete(k) : state.cats.add(k);
  c.setAttribute("aria-pressed", String(state.cats.has(k)));
  store.set("cats", [...state.cats]); refresh();
});

for (const [id, key] of [["tMaybe", "showMaybe"], ["tUsc", "showUsc"], ["tWp", "showWp"], ["tHide", "hideOutside"]]) {
  const el = $(id); el.checked = state[key];
  el.addEventListener("change", () => { state[key] = el.checked; store.set(key, el.checked); refresh(); });
}

function updateMoreLabel() {
  const n = state.cats.size + (state.showUsc ? 1 : 0) + (state.showWp ? 1 : 0) + (state.hideOutside ? 1 : 0) + (state.showMaybe ? 0 : 1);
  $("moreSum").textContent = "Kategorien & Anzeige" + (n ? ` (${n} aktiv)` : "");
}

function refresh() {
  state.listLimit = 150;
  if (state.selected != null && !visible(studios[state.selected])) closeDetail();
  drawMarkers(); renderList(); updateMoreLabel();
  if (state.selected != null) renderDetail(studios[state.selected]);
}

// ---------------------------------------------------------------- Start
const [y, mo, da] = DATA.stand.split("-");
$("stand").textContent = `Stand ${da}.${mo}.${y}`;
syncTownSelect();
drawMarkers(); drawCircle(); renderList(); updateMoreLabel();
fitRadius();
</script>
</body>
</html>
